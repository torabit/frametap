[package]
name = "frametap"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.13.2"
# 描画は glow (OpenGL) で足りる。既定の wgpu は依存が重く、この用途に利点がない。
# wayland と x11 は Windows では効かないが、Linux で cargo test と clippy を通すために要る。
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# ui.rs は eframe を知らずに済ませる。eframe に触るのは app.rs と main.rs だけである。
egui = "0.36.2"

[target."cfg(windows)".dependencies]
hidapi = "2.6.7"
windows = { version = "0.62.2", features = ["Win32_System_Performance"] }
