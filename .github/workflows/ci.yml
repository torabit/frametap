name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cargo.toml
        id: detect
        shell: pwsh
        run: |
          if (Test-Path -Path 'Cargo.toml' -PathType Leaf) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      # rustup が rust-toolchain.toml を読むため、ここで版を固定しない。
      # llvm-tools は hid_probe.exe の import を読む llvm-readobj のために入れる。
      - name: Install components
        if: steps.detect.outputs.exists == 'true'
        run: rustup component add clippy rustfmt llvm-tools

      - name: Format
        if: steps.detect.outputs.exists == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.detect.outputs.exists == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        run: cargo test

      # 配布先に VC++ 再頒布可能パッケージのインストールを要求しないよう CRT を静的リンクする。
      # hidapi は cc 経由で C を混ぜるが、cc は crt-static を見て /MT に切り替える。
      - name: Build binaries
        if: steps.detect.outputs.exists == 'true'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --bin frametap --bin hid_probe --release

      # import を読む道具に llvm-readobj を選ぶ。dumpbin は Visual Studio の版とエディションで
      # 置き場所が変わるが、llvm-readobj は rustup が toolchain 配下の固定位置に置く。
      #
      # system かどうかを DLL 名の一覧では決めない。eframe は opengl32.dll や dwmapi.dll など
      # 一覧に載せ忘れやすいものを引き、載せ忘れは「runner の System32 から複製して配る」という
      # 形で出る。解決した先が System32 の下かどうかで判定すれば、一覧を保守しなくても漏れない。
      - name: Package binaries
        if: steps.detect.outputs.exists == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stageDir = 'dist'
          $exeNames = @('frametap.exe', 'hid_probe.exe')
          $systemDir = Join-Path $env:SystemRoot 'System32'

          $sysroot = (rustc --print sysroot).Trim()
          $readobj = Get-ChildItem -Path (Join-Path $sysroot 'lib/rustlib/*/bin/llvm-readobj.exe') |
            Select-Object -First 1
          if (-not $readobj) {
            throw "llvm-readobj が $sysroot 配下に無い"
          }

          # 探す先は PATH と VC 再頒布ディレクトリ。PATH には System32 が入るので、
          # OS の一部である DLL もここで解決される。System32 の下かどうかは後で見る。
          $vcRedistGlob = 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT'
          $vcRedistDirs = Get-ChildItem -Path $vcRedistGlob -Directory -ErrorAction SilentlyContinue
          $searchDirs = @($env:PATH -split ';') + @($vcRedistDirs | ForEach-Object { $_.FullName })

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $unresolved = @()
          foreach ($exeName in $exeNames) {
            $exePath = Join-Path 'target/release' $exeName
            if (-not (Test-Path -Path $exePath -PathType Leaf)) {
              throw "$exePath が無い"
            }

            # --coff-imports は Import と DelayImport のブロックを出し、各ブロックの Name 行が DLL 名になる。
            $readobjOutput = & $readobj.FullName --coff-imports $exePath
            if ($LASTEXITCODE -ne 0) {
              throw "llvm-readobj が $exeName で失敗した (exit $LASTEXITCODE)"
            }

            $importedDllNames = @($readobjOutput |
              Select-String -Pattern '^\s+Name:\s+(\S+)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } |
              Sort-Object -Unique)

            # Windows の exe は必ず kernel32 等を import する。0 件なら読み取りが壊れている。
            if ($importedDllNames.Count -eq 0) {
              Write-Host $readobjOutput
              throw "$exeName の import が 1 件も取れなかった"
            }

            Copy-Item -Path $exePath -Destination $stageDir -Force

            Write-Host "$exeName が import する DLL:"
            foreach ($name in $importedDllNames) {
              # api-ms-win-* は OS の一部だが、実体のあるファイルとして解決されないことがある。
              if ($name -like 'api-ms-win-*') {
                Write-Host "  $name (system)"
                continue
              }

              $resolved = $searchDirs |
                Where-Object { $_ } |
                ForEach-Object { Join-Path $_ $name } |
                Where-Object { Test-Path -Path $_ -PathType Leaf } |
                Select-Object -First 1

              if (-not $resolved) {
                Write-Host "  $name (見つからないため同梱できない)"
                $unresolved += "$exeName の $name"
                continue
              }

              $full = (Resolve-Path -LiteralPath $resolved).Path
              if ($full.StartsWith($systemDir, [System.StringComparison]::OrdinalIgnoreCase)) {
                Write-Host "  $name (system: $full)"
                continue
              }

              Copy-Item -LiteralPath $full -Destination $stageDir -Force
              Write-Host "  $name (同梱: $full)"
            }

            Write-Host ''
          }

          if ($unresolved.Count -gt 0) {
            throw "配布先に無い可能性のある DLL を同梱できなかった: $($unresolved -join ', ')"
          }

          Write-Host 'artifact の中身:'
          Get-ChildItem -Path $stageDir | ForEach-Object {
            Write-Host "  $($_.Name) ($($_.Length) bytes)"
          }

      - name: Upload binaries
        if: steps.detect.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frametap-windows-x64
          path: dist/
          if-no-files-found: error
